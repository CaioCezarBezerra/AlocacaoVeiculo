services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alocacao-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: alocacao-api

    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AlocacaoVeiculos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"

    ports:
      - "7005:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - api_logs:/app/logs


  frontend:
    build:
      context: ../../front-AlocacaoVeiculoAssistencia/AlocacaoVeiculo
      dockerfile: Dockerfile

    container_name: alocacao-frontend

    ports:
      - "4200:80"

    depends_on:
      - api


volumes:
  sqlserver_data:
  api_logs: