<mat-expansion-panel
  hideToggle
  [expanded]="true"
  class="mat-elevation-z8">

  <mat-expansion-panel-header>

    <mat-panel-title>
      Lista de veículos
    </mat-panel-title>

  </mat-expansion-panel-header>


  <div class="mat-shadow-2">

    <table mat-table [dataSource]="dataSource">


     

      <ng-container matColumnDef="modelo">

        <th mat-header-cell *matHeaderCellDef>
          Modelo
        </th>

        <td mat-cell *matCellDef="let element">

          @if (editando === element) {

            <input
              matInput
              [(ngModel)]="element.modelo"
            />

          } @else {

            {{ element.modelo }}

          }

        </td>

      </ng-container>



      <ng-container matColumnDef="placa">

        <th mat-header-cell *matHeaderCellDef>
          Placa
        </th>

        <td mat-cell *matCellDef="let element">

          @if (editando === element) {

            <input
              matInput
              [(ngModel)]="element.placa"
            />

          } @else {

            {{ element.placa }}

          }

        </td>

      </ng-container>


      <ng-container matColumnDef="grupoNome">

        <th mat-header-cell *matHeaderCellDef>
          Grupo
        </th>

        <td mat-cell *matCellDef="let element">

          {{ element.grupoNome }}

        </td>

      </ng-container>


      <ng-container matColumnDef="acoes">

        <th mat-header-cell *matHeaderCellDef>
          Ações
        </th>

        <td mat-cell *matCellDef="let element">

          @if (editando === element) {

            <button
              mat-icon-button
              class="btn-salvar"
              (click)="salvar(element)"
              matTooltip="Salvar">

              <mat-icon>save</mat-icon>

            </button>

          } @else {

            <button
              mat-icon-button
              class="btn-editar"
              (click)="editar(element)"
              matTooltip="Editar">

              <mat-icon>edit</mat-icon>

            </button>


            <button
              mat-icon-button
              class="btn-excluir"
              (click)="excluir(element)"
              matTooltip="Excluir">

              <mat-icon>delete</mat-icon>

            </button>

          }

        </td>

      </ng-container>


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns">
      </tr>

    </table>


    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</mat-expansion-panel>
